name: Foundation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Show resolved SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore FlowPlane.slnx --disable-parallel -m:1 --nologo
      - name: Verify formatting
        run: dotnet format FlowPlane.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build FlowPlane.slnx --configuration Release --no-restore --nologo -m:1
      - name: Test
        run: dotnet test FlowPlane.slnx --configuration Release --no-build --nologo -m:1

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  containers:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: >-
          docker build
          --file src/backend/FlowPlane.Api/Dockerfile
          --tag flowplane-backend:ci
          .
      - name: Build production frontend image
        run: >-
          docker build
          --file src/frontend/Dockerfile
          --target production
          --tag flowplane-frontend:ci
          .
      - name: Verify static Nginx runtime
        run: |
          docker run --rm --add-host backend:127.0.0.1 --entrypoint sh flowplane-frontend:ci -ec '
            nginx -t
            ! command -v node
            ! command -v vite
            test -f /usr/share/nginx/html/index.html
            test ! -e /workspace
            test ! -e /usr/share/nginx/html/node_modules
            test -z "$(find /usr/share/nginx/html -type f -name "*.map" -print -quit)"
          '
          docker image inspect flowplane-frontend:ci --format '{{json .Config.ExposedPorts}}' |
            grep -Fx '{"80/tcp":{}}'

  postgresql:
    name: PostgreSQL migration and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify PostgreSQL baseline
        run: sh tests/container/a05-postgresql-baseline.sh

  documentation:
    name: Documentation and repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify documentation contract
        run: sh tests/documentation/foundation-contract.sh
      - name: Verify shell syntax
        run: find tests deploy/compose -type f -name '*.sh' -exec sh -n {} \;
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose/compose.yaml config --quiet
      - name: Verify tracked-file hygiene
        run: |
          if git ls-files | grep -Eq '(^|/)(bin|obj|node_modules|dist)/|(^|/)\.env$'
          then
            echo 'Generated or local-only content is tracked' >&2
            exit 1
          fi
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD
