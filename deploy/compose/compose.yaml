name: flowplane

services:
  nginx:
    image: nginx:1.30.5-alpine3.24
    ports:
      - "127.0.0.1:${FLOWPLANE_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-dev:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1/
          && wget -q -O /dev/null http://127.0.0.1/api/health/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  frontend-dev:
    build:
      context: ../..
      dockerfile: src/frontend/Dockerfile
      target: development
      args:
        USER_UID: "${FLOWPLANE_UID:-1000}"
        USER_GID: "${FLOWPLANE_GID:-1000}"
    init: true
    environment:
      VITE_FLOWPLANE_OIDC_AUTHORITY: "http://127.0.0.1:${FLOWPLANE_KEYCLOAK_PORT:-8081}/realms/flowplane"
      VITE_FLOWPLANE_OIDC_CLIENT_ID: flowplane-spa
    volumes:
      - ../../src/frontend:/workspace/src/frontend
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - >-
          const response = await fetch('http://127.0.0.1:5173/');
          if (!response.ok) process.exit(1)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend-production:
    profiles:
      - production
    build:
      context: ../..
      dockerfile: src/frontend/Dockerfile
      target: production
      args:
        USER_UID: "${FLOWPLANE_UID:-1000}"
        USER_GID: "${FLOWPLANE_GID:-1000}"
        VITE_FLOWPLANE_OIDC_AUTHORITY: "http://127.0.0.1:${FLOWPLANE_KEYCLOAK_PORT:-8081}/realms/flowplane"
        VITE_FLOWPLANE_OIDC_CLIENT_ID: flowplane-spa
    ports:
      - "127.0.0.1:${FLOWPLANE_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1/
          && wget -q -O /dev/null http://127.0.0.1/api/health/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  backend:
    build:
      context: ../..
      dockerfile: src/backend/FlowPlane.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FlowPlane__Authentication__Issuer: "http://127.0.0.1:${FLOWPLANE_KEYCLOAK_PORT:-8081}/realms/flowplane"
      FlowPlane__Authentication__MetadataAddress: "http://keycloak:8080/realms/flowplane/.well-known/openid-configuration"
      FlowPlane__Authentication__Audience: flowplane-api
      FlowPlane__Authentication__RequireHttpsMetadata: "false"
      FlowPlane__PostgreSql__Host: postgres
      FlowPlane__PostgreSql__Port: "5432"
      FlowPlane__PostgreSql__Database: "${FLOWPLANE_POSTGRES_DB:-flowplane}"
      FlowPlane__PostgreSql__Username: "${FLOWPLANE_POSTGRES_USER:-flowplane}"
      FlowPlane__PostgreSql__Password: "${FLOWPLANE_POSTGRES_PASSWORD:-flowplane-local-development-only}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q ' 200 ' <&3"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: "${FLOWPLANE_POSTGRES_USER:-flowplane}"
      POSTGRES_PASSWORD: "${FLOWPLANE_POSTGRES_PASSWORD:-flowplane-local-development-only}"
      POSTGRES_DB: "${FLOWPLANE_POSTGRES_DB:-flowplane}"
    ports:
      - "127.0.0.1:${FLOWPLANE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${FLOWPLANE_KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${FLOWPLANE_KEYCLOAK_ADMIN_PASSWORD:-keycloak-local-development-only}"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://127.0.0.1:${FLOWPLANE_KEYCLOAK_PORT:-8081}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      FLOWPLANE_BROWSER_ORIGIN: "http://127.0.0.1:${FLOWPLANE_HTTP_PORT:-8080}"
      FLOWPLANE_KEYCLOAK_TEST_USERNAME: "${FLOWPLANE_KEYCLOAK_TEST_USERNAME:-flowplane-developer}"
      FLOWPLANE_KEYCLOAK_TEST_PASSWORD: "${FLOWPLANE_KEYCLOAK_TEST_PASSWORD:-flowplane-developer-local-only}"
    ports:
      - "127.0.0.1:${FLOWPLANE_KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/flowplane-realm.json:/opt/keycloak/data/import/flowplane-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  postgres-data:
