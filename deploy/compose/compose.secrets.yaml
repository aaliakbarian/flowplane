services:
  backend:
    user: "${FLOWPLANE_UID:-1000}:${FLOWPLANE_GID:-1000}"
    environment:
      FlowPlane__Secrets__RootCertificatePath: /run/secrets/flowplane_root_certificate
    secrets:
      - flowplane_root_certificate

secrets:
  flowplane_root_certificate:
    file: "${FLOWPLANE_SECRET_ROOT_CERTIFICATE_FILE:-./secrets/flowplane-root.pfx}"
